name: Mixed subsistence cohort correction
on:
  push:
    branches: [feature/mixed-subsistence-diffusion-v5]
    paths: ['.github/workflows/mixed-cohort-validation.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prove the pre-repair deficit-cohort bug
        shell: bash
        run: |
          python3 Tools/MixedSubsistence/RepairPreparedCohort.py --register-only
          set +e
          bash Tools/Test-Headless.sh --only=PreparedResidentCohortChecks --jobs=1 > /tmp/red.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/red.log
          test "$STATUS" -ne 0
          grep -q 'automatic assignments must fit the post-dispatch resident cohort' /tmp/red.log
      - name: Repair prepared cohorts
        run: python3 Tools/MixedSubsistence/RepairPreparedCohort.py
      - name: Run complete fixed suite
        shell: bash
        run: |
          set -o pipefail
          ONLY=$(python3 -c 'import re; print(",".join(re.findall(r"new ParallelChecks\.Entry \{ Name = \"([^\"]+)\"", open("Tools/Headless/Program.cs").read())))')
          test -n "$ONLY"
          bash Tools/Test-Headless.sh --only="$ONLY" --jobs=3 --check-timings 2>&1 | tee /tmp/green.log
      - name: Commit only tested source
        id: commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'Anthropocene validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/_Anthropocene/Simulation/Model.cs Assets/_Anthropocene/Simulation/TurnPlanning.cs Assets/_Anthropocene/Simulation/ProductionDemand.cs Assets/_Anthropocene/Simulation/NeolithicProduction.cs Assets/_Anthropocene/Simulation/EconomicPlanner.cs Assets/_Anthropocene/Simulation/GenerationalEconomy.cs Tools/Headless/Program.cs Tools/Headless/Anthropocene.Headless.csproj
          git commit -m 'Use post-dispatch residents for workforce planning and preserve connected food consumers'
          git push origin HEAD:refs/heads/feature/mixed-subsistence-diffusion-v5
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show -s --format='TESTED_SOURCE %H %s'
      - name: Bundle evidence
        if: always()
        run: |
          mkdir -p TestResults/Cohort
          cp /tmp/red.log /tmp/green.log TestResults/Cohort/ 2>/dev/null || true
          git rev-parse HEAD > TestResults/Cohort/source-sha.txt
          tar -czf TestResults/Cohort/source.tgz AGENTS.md Assets/_Anthropocene/Simulation Assets/_Anthropocene/Resources Tools Docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-cohort-source-and-tests
          path: TestResults/Cohort/
          retention-days: 7
  worlds:
    needs: repair
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [control, candidate]
        seed: [11, 23, 47, 101, 1729]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve matched world
        shell: bash
        run: |
          mkdir -p TestResults/MixedCohort
          EXTRA=''
          if [ '${{ matrix.mode }}' = 'control' ]; then
            EXTRA='--set=NeolithicFishingEnabled=0,CorrectedAquaticSeasonalPressureEnabled=0,TradePracticePerValue=0,HusbandryProximityPracticePerYear=0,HusbandryTamingEnabled=0'
          fi
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- --revision=${{ needs.repair.outputs.commit }} --players=80 --seed=${{ matrix.seed }} --shape=Continents --production-config=1 --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 --details=1 --metrics=1 --fingerprints=0 $EXTRA --output=TestResults/MixedCohort/${{ matrix.mode }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-cohort-${{ matrix.mode }}-${{ matrix.seed }}
          path: TestResults/MixedCohort/*.json
          retention-days: 7
  combined:
    needs: worlds
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mixed-cohort-*
          path: TestResults/Combined
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-cohort-all-evidence
          path: TestResults/Combined/
          retention-days: 7
