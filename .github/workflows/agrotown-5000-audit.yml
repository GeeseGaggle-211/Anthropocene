name: Agrotown 5000 source audit
on:
  push:
    branches: [experiments/agrotown-5000-audit-20261107]
    paths: ['Tools/AgrotownAudit/**', '.github/workflows/agrotown-5000-audit.yml']
permissions:
  contents: read
concurrency:
  group: agrotown-5000-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify unchanged production source
        run: git diff --exit-code 07f3501c2d5e047e44d61e85cc0d4613b54572d6 -- Assets/_Anthropocene/Simulation Assets/_Anthropocene/Resources
      - name: Record provenance
        run: |
          mkdir -p TestResults/AgrotownAudit
          git rev-parse HEAD > TestResults/AgrotownAudit/experiment-commit.txt
          dotnet --info > TestResults/AgrotownAudit/runtime.txt
      - name: Run native audit and candidate envelope
        run: dotnet run -c Release --project Tools/AgrotownAudit/Anthropocene.AgrotownAudit.csproj -- TestResults/AgrotownAudit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agrotown-5000-source-audit
          retention-days: 14
          path: |
            TestResults/AgrotownAudit/
            Tools/AgrotownAudit/
            Assets/_Anthropocene/Simulation/*.cs
            Assets/_Anthropocene/Resources/OpeningConfig.json
            Assets/_Anthropocene/Resources/ResourceGenerationConfig.json
