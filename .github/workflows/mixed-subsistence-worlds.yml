name: Mixed subsistence matched worlds

on:
  push:
    branches:
      - 'feature/mixed-subsistence-diffusion-*'
    paths:
      - '.github/workflows/mixed-subsistence-worlds.yml'
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [control, candidate]
        seed: [11, 23, 47, 101, 1729]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run matched world
        shell: bash
        run: |
          mkdir -p TestResults/MixedSubsistence
          EXTRA=""
          if [ "${{ matrix.mode }}" = "control" ]; then
            EXTRA="--set=NeolithicFishingEnabled=0,CorrectedAquaticSeasonalPressureEnabled=0,TradePracticePerValue=0,HusbandryProximityPracticePerYear=0,HusbandryTamingEnabled=0"
          fi
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- \
            --players=80 --seed=${{ matrix.seed }} --shape=Continents --production-config=1 \
            --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 \
            --details=1 --metrics=1 --fingerprints=0 $EXTRA \
            --output=TestResults/MixedSubsistence/${{ matrix.mode }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-${{ matrix.mode }}-${{ matrix.seed }}
          path: TestResults/MixedSubsistence/*.json
          retention-days: 3

  summarize:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mixed-*
          path: TestResults/MixedSubsistence
          merge-multiple: true
      - name: Summarize
        run: |
          python3 Tools/PerformanceAudit/Summarize-MixedSubsistence.py TestResults/MixedSubsistence --out TestResults/MixedSubsistence/summary.md
          cat TestResults/MixedSubsistence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-subsistence-summary
          path: TestResults/MixedSubsistence/summary.md
          retention-days: 3
