name: Legacy fission seed 11 diagnostic

on:
  push:
    branches:
      - experiment/fission-exit-pressure
    paths:
      - '.github/workflows/fission-legacy-diagnostic.yml'

jobs:
  legacy-seed11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reproduce legacy seed 11
        run: |
          mkdir -p TestResults/FissionPressure
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- \
            --players=80 --seed=11 --shape=Continents --production-config=1 \
            --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 \
            --details=1 --metrics=1 --fingerprints=0 \
            --set=FissionPressureRule=LegacyQoL \
            --output=TestResults/FissionPressure/LegacyQoL-11.json
