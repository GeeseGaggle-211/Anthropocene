name: Mixed subsistence integration checks

on:
  push:
    branches:
      - feature/mixed-subsistence-diffusion-v4
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run focused mixed-subsistence checks
        run: |
          bash Tools/Test-Headless.sh \
            --only=HusbandryDiffusionChecks,SettlingChecks,TradeChecks,FishingStateChecks,FishingObservationChecks,FishingEconomyChecks,FishingResourceChecks,FissionChecks,Issue32CapabilityChecks \
            --jobs=1 --check-timings
