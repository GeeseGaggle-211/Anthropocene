name: Mixed integration phase diagnostic
on:
  push:
    branches: [feature/mixed-subsistence-diffusion-v5]
    paths: ['.github/workflows/mixed-resume-diagnostic.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Preserve source for reproducible local review
        run: |
          mkdir -p TestResults/Resume
          tar -czf TestResults/Resume/review-source.tar.gz Assets/_Anthropocene/Simulation Assets/_Anthropocene/Resources Tools/Headless Tools/PerformanceAudit Tools/Test-Headless.sh Docs AGENTS.md
      - name: Instrument diagnostic copy only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/_Anthropocene/Simulation/TurnResolver.cs')
          s=p.read_text()
          def probe(tag):
              return '\nforeach (var z in w.Camps.Where(z => z.Workforce.Assigned > z.Population)) Console.WriteLine("BAD_PHASE '+tag+' turn=" + w.Turn + " camp=" + z.Id + " pop=" + z.Population + " assigned=" + z.Workforce.Assigned + " roles=" + string.Join(",", z.Workforce.Assignments.Select(a => a.Role + ":" + a.Population)));\n'
          markers=[('EconomicIntents.Apply(camp, order.Economy);','ApplyIntent'),('Supply.DepositReturns(w, record);','Movement'),('Trade.Finish(w, trade, record);','AfterEconomy'),('Ownership.Bind(w);','Bind'),('using (PhaseProfile.Scope("Fission")) Fission.Resolve(w, record, execution, LastMetrics, mobile);','Fission')]
          for needle,label in markers:
              assert needle in s, label
              if label=='AfterEconomy': s=s.replace(needle,probe(label)+needle)
              else: s=s.replace(needle,needle+probe(label))
          p.write_text(s)
          p=Path('Assets/_Anthropocene/Simulation/GenerationalEconomy.cs'); s=p.read_text()
          for needle,label in [('ResolveManagedHerds(w, record, horizon, needs);','Managed'),('ApplyStorage(w, record, intervals);','Production'),('w.Days += record.Duration;','AfterDemography')]:
              assert needle in s,label
              s=s.replace(needle,needle+probe(label))
          p.write_text(s)
          PY
      - name: Reproduce candidate seed 11
        run: |
          set -o pipefail
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- --players=80 --seed=11 --shape=Continents --production-config=1 --turns=12 --post-opening-turns=1 --workers=4 --partition-size=64 --warmup=0 --details=1 --metrics=1 --fingerprints=0 --output=TestResults/Resume/candidate-11.json 2>&1 | tee TestResults/Resume/trace.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-resume-diagnostic
          path: TestResults/Resume
          retention-days: 7
