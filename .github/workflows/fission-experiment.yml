name: Fission pressure experiment checks

on:
  push:
    branches:
      - experiment/fission-exit-pressure
  workflow_dispatch:

jobs:
  fission-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run focused fission checks
        run: bash Tools/Test-Headless.sh --only=FissionChecks --jobs=1 --check-timings
