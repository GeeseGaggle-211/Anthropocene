name: Fission pressure matched worlds

on:
  push:
    branches:
      - experiment/fission-exit-pressure
    paths:
      - '.github/workflows/fission-world-experiment.yml'

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rule: [Current, LegacyQoL, CurrentPlusExitOpportunity]
        seed: [11, 23, 47, 101, 1729]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run matched world
        run: |
          mkdir -p TestResults/FissionPressure
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- \
            --players=80 --seed=${{ matrix.seed }} --shape=Continents --production-config=1 \
            --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 \
            --details=1 --metrics=1 --fingerprints=0 \
            --set=FissionPressureRule=${{ matrix.rule }} \
            --output=TestResults/FissionPressure/${{ matrix.rule }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.rule }}-${{ matrix.seed }}
          path: TestResults/FissionPressure/*.json
          retention-days: 3

  summarize:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: TestResults/FissionPressure
          merge-multiple: true
      - name: Summarize
        run: |
          python3 Tools/PerformanceAudit/Summarize-FissionPressure.py TestResults/FissionPressure \
            --out TestResults/FissionPressure/summary.md
          cat TestResults/FissionPressure/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fission-pressure-summary
          path: TestResults/FissionPressure/summary.md
          retention-days: 3
