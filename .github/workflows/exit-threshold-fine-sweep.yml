name: Exit opportunity fine threshold sweep

on:
  push:
    branches:
      - experiment/fission-exit-pressure
    paths:
      - '.github/workflows/exit-threshold-fine-sweep.yml'

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        threshold: ['0.055','0.060','0.065','0.070']
        seed: [11,23,47,101,1729]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run matched world
        run: |
          mkdir -p TestResults/ExitThresholdFineSweep
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- \
            --players=80 --seed=${{ matrix.seed }} --shape=Continents --production-config=1 \
            --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 \
            --details=1 --metrics=1 --fingerprints=0 \
            --set=FissionPressureRule=CurrentPlusExitOpportunity,FissionExitThreshold=${{ matrix.threshold }} \
            --output=TestResults/ExitThresholdFineSweep/Exit-${{ matrix.threshold }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: exit-fine-${{ matrix.threshold }}-${{ matrix.seed }}
          path: TestResults/ExitThresholdFineSweep/*.json
          retention-days: 3
