name: Agricultural technology validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Assets/_Anthropocene/Simulation/**'
      - 'Assets/_Anthropocene/Resources/AgriculturalTechnologyOpeningConfig.json'
      - 'Tools/AgriculturalTechnologySweep/**'
      - 'Tools/Headless/AgriculturalTechnologyChecks.cs'
      - 'Tools/Headless/SanitationChecks.cs'
      - 'Tools/Headless/DemandControlChecks.cs'
      - 'Tools/Headless/GoodsStorageChecks.cs'
      - 'Tools/Headless/HousingMaterialRecipeChecks.cs'
      - 'Tools/Headless/NeolithicChecks.cs'
      - 'Tools/Headless/SaveCodecChecks.cs'
      - '.github/workflows/agricultural-technology.yml'
permissions:
  contents: read
concurrency:
  group: agricultural-technology-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Focused contracts
        run: dotnet run -c Release --project Tools/Headless/Anthropocene.Headless.csproj -- --only=SanitationChecks,AgriculturalTechnologyChecks,HousingMaterialRecipeChecks,DemandControlChecks,GoodsStorageChecks,SaveCodecChecks --jobs=1
      - name: Five-seed matched smoothed-calendar sweep
        run: dotnet run -c Release --project Tools/AgriculturalTechnologySweep/Anthropocene.AgriculturalTechnologySweep.csproj
      - name: Labor attribution and exact diagnostic replay
        run: dotnet run -c Release --project Tools/AgriculturalTechnologySweep/Anthropocene.AgriculturalTechnologySweep.csproj -- --labor-audit
      - name: Sparse network scale benchmark
        env:
          DOTNET_TieredCompilation: '0'
        run: dotnet run -c Release --project Tools/AgriculturalTechnologySweep/Anthropocene.AgriculturalTechnologySweep.csproj -- --benchmark
      - name: Publish measurements
        run: |
          git rev-parse HEAD > TestResults/AgriculturalTechnology/commit.txt
          python3 Tools/AgriculturalTechnologySweep/Summarize.py
          python3 Tools/Docs/Check-CurrentContract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agricultural-technology-validation
          retention-days: 30
          path: TestResults/AgriculturalTechnology/
