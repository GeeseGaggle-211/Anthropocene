name: Smooth calendar integration
on:
  push:
    branches: [features/smooth-calendar]
  pull_request:
    paths:
      - 'Assets/_Anthropocene/Simulation/**'
      - 'Assets/_Anthropocene/Resources/SmoothCalendarOpeningConfig.json'
      - 'Tools/SmoothCalendar/**'
      - '.github/workflows/smooth-calendar.yml'
permissions:
  contents: read
concurrency:
  group: smooth-calendar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Provenance
        run: |
          mkdir -p TestResults/SmoothCalendar
          git rev-parse HEAD > TestResults/SmoothCalendar/commit.txt
          git diff --stat 07f3501c2d5e047e44d61e85cc0d4613b54572d6 > TestResults/SmoothCalendar/changes.txt
      - name: Focused calendar integration tests
        run: dotnet run -c Release --project Tools/SmoothCalendar/Anthropocene.SmoothCalendar.csproj 2>&1 | tee TestResults/SmoothCalendar/calendar.log
      - name: Registered headless regression
        run: |
          checks=$(python3 -c 'import re,pathlib;s=pathlib.Path("Tools/Headless/Program.cs").read_text();names=re.findall(r"new ParallelChecks.Entry \{ Name = \"([^\"]+)\"",s);assert len(names)>60;print(",".join(names))')
          printf '%s\n' "$checks" > TestResults/SmoothCalendar/registered-suites.txt
          dotnet run -c Release --project Tools/Headless/Anthropocene.Headless.csproj -- "--only=$checks" --check-timings 2>&1 | tee TestResults/SmoothCalendar/headless.log
      - name: Contract and whitespace checks
        run: |
          python3 Tools/Docs/Check-CurrentContract.py
          git diff --check 07f3501c2d5e047e44d61e85cc0d4613b54572d6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smooth-calendar-validation
          retention-days: 30
          path: |
            TestResults/SmoothCalendar/
            Tools/SmoothCalendar/Program.cs
            Tools/SmoothCalendar/Anthropocene.SmoothCalendar.csproj
            Docs/SmoothCalendar.md
