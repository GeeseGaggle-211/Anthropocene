name: Validate dispatch cohort repair
on:
  push:
    branches: [fix/mixed-resident-dispatch]
    paths: ['.github/workflows/mixed-dispatch-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply exact guarded source edits
        run: python3 Tools/DispatchCohortRepair.py
      - name: Focused regression checks
        run: bash Tools/Test-Headless.sh --only=DispatchCohortChecks,PlanningDraftChecks,EconomicTransitionChecks,DemandControlChecks,FissionChecks,FishingEconomyChecks --jobs=2 --check-timings
      - name: Reproduce complete seed 11 trajectory
        run: |
          mkdir -p TestResults/DispatchCohort
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- --players=80 --seed=11 --shape=Continents --production-config=1 --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 --details=1 --metrics=1 --fingerprints=0 --output=TestResults/DispatchCohort/candidate-11.json
      - name: Commit tested source only, without overwriting concurrent work
        shell: bash
        run: |
          git diff --check
          git add Assets/_Anthropocene/Simulation/TurnPlanning.cs Assets/_Anthropocene/Simulation/Model.cs Assets/_Anthropocene/Simulation/ProductionDemand.cs Assets/_Anthropocene/Simulation/EconomicPlanner.cs Tools/Headless/Anthropocene.Headless.csproj Tools/Headless/Program.cs
          git rm Tools/DispatchCohortRepair.py .github/workflows/mixed-dispatch-repair.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Reserve dispatched residents before automatic economy planning'
          git push origin HEAD:fix/mixed-resident-dispatch
          git rev-parse HEAD > TestResults/DispatchCohort/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatch-cohort-repair
          path: TestResults/DispatchCohort
          retention-days: 7
