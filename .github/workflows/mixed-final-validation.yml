name: Final mixed subsistence validation
on:
  push:
    branches: [feature/mixed-subsistence-diffusion-v5]
    paths: ['.github/workflows/mixed-final-validation.yml']
permissions:
  contents: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run every registered fixed suite
        shell: bash
        run: |
          mkdir -p TestResults/FinalMixed
          ONLY=$(python3 - <<'PY'
          import re
          text=open('Tools/Headless/Program.cs').read()
          names=re.findall(r'new ParallelChecks\.Entry \{ Name = "([^"]+)"', text)
          assert len(names)>60
          print(','.join(names))
          PY
          )
          set -o pipefail
          bash Tools/Test-Headless.sh --only="$ONLY" --jobs=3 --check-timings 2>&1 | tee TestResults/FinalMixed/fixed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-mixed-fixed
          path: TestResults/FinalMixed
          retention-days: 14
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [control, candidate]
        seed: [11, 23, 47, 101, 1729]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run matched world with accepted fission baseline
        shell: bash
        run: |
          mkdir -p TestResults/FinalMixed
          EXTRA=""
          if [ "${{ matrix.mode }}" = "control" ]; then
            EXTRA="--set=NeolithicFishingEnabled=0,CorrectedAquaticSeasonalPressureEnabled=0,TradePracticePerValue=0,HusbandryProximityPracticePerYear=0,HusbandryTamingEnabled=0"
          fi
          set -o pipefail
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- --players=80 --seed=${{ matrix.seed }} --shape=Continents --production-config=1 --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 --details=1 --metrics=1 --fingerprints=0 $EXTRA --output=TestResults/FinalMixed/${{ matrix.mode }}-${{ matrix.seed }}.json 2>&1 | tee TestResults/FinalMixed/${{ matrix.mode }}-${{ matrix.seed }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-mixed-${{ matrix.mode }}-${{ matrix.seed }}
          path: TestResults/FinalMixed
          retention-days: 14
  collect:
    needs: [fixed, simulate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: final-mixed-*
          path: TestResults/FinalMixed
          merge-multiple: true
      - name: Record evidence and require complete matched bank
        shell: bash
        run: |
          git rev-parse HEAD > TestResults/FinalMixed/commit.txt
          tar -czf TestResults/FinalMixed/source.tar.gz Assets/_Anthropocene/Simulation Assets/_Anthropocene/Resources Tools/Headless Tools/PerformanceAudit Tools/Test-Headless.sh Tools/Docs Docs AGENTS.md
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('TestResults/FinalMixed')
          for mode in ['control','candidate']:
              for seed in [11,23,47,101,1729]:
                  p=root/f'{mode}-{seed}.json'
                  d=json.loads(p.read_text())
                  post=[s for s in d['samples'] if s.get('postOpening')]
                  assert len(post)==40,(p,len(post))
                  print(mode,seed,post[-1]['population'],post[-1].get('priorWeightedQol'))
          PY
          python3 Tools/PerformanceAudit/Summarize-MixedSubsistence.py TestResults/FinalMixed --out TestResults/FinalMixed/summary.md
          cat TestResults/FinalMixed/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-mixed-evidence
          path: TestResults/FinalMixed
          retention-days: 14
