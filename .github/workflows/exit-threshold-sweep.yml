name: Exit opportunity threshold sweep

on:
  push:
    branches:
      - experiment/fission-exit-pressure
    paths:
      - '.github/workflows/exit-threshold-sweep.yml'

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        threshold: ['0.05','0.075','0.10','0.125']
        seed: [11,23,47,101,1729]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run matched world
        run: |
          mkdir -p TestResults/ExitThresholdSweep
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- \
            --players=80 --seed=${{ matrix.seed }} --shape=Continents --production-config=1 \
            --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 \
            --details=1 --metrics=1 --fingerprints=0 \
            --set=FissionPressureRule=CurrentPlusExitOpportunity,FissionExitThreshold=${{ matrix.threshold }} \
            --output=TestResults/ExitThresholdSweep/Exit-${{ matrix.threshold }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: exit-${{ matrix.threshold }}-${{ matrix.seed }}
          path: TestResults/ExitThresholdSweep/*.json
          retention-days: 3

  summarize:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exit-*
          path: TestResults/ExitThresholdSweep
          merge-multiple: true
      - name: Summarize sweep
        run: |
          python3 Tools/PerformanceAudit/Summarize-ExitThresholdSweep.py TestResults/ExitThresholdSweep \
            --out TestResults/ExitThresholdSweep/summary.md
          cat TestResults/ExitThresholdSweep/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: exit-threshold-sweep-summary
          path: TestResults/ExitThresholdSweep/summary.md
          retention-days: 3
