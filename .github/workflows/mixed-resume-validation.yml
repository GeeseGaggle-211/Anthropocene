name: Mixed subsistence resume validation
on:
  push:
    branches: [feature/mixed-subsistence-diffusion-v5]
    paths: ['.github/workflows/mixed-resume-validation.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply exact source hardening
        run: python3 Tools/MixedSubsistence/ApplyResumeHardening.py
      - name: Run complete fixed suite
        shell: bash
        run: |
          set -o pipefail
          ONLY=$(python3 -c 'import re; print(",".join(re.findall(r"new ParallelChecks\.Entry \{ Name = \"([^\"]+)\"", open("Tools/Headless/Program.cs").read())))')
          test -n "$ONLY"
          bash Tools/Test-Headless.sh --only="$ONLY" --jobs=3 --check-timings 2>&1 | tee /tmp/mixed-checks.log
      - name: Commit tested source without rewriting history
        id: commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'Anthropocene validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/_Anthropocene/Simulation/Societies.cs Tools/Headless/Program.cs Tools/Headless/Anthropocene.Headless.csproj
          if ! git diff --cached --quiet; then
            git commit -m 'Index local herd exposure and register resident acquisition regressions'
            git push origin HEAD:refs/heads/feature/mixed-subsistence-diffusion-v5
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show -s --format='TESTED_SOURCE %H %s'
      - name: Bundle reviewed simulation source
        if: always()
        run: |
          mkdir -p TestResults/Resume
          git rev-parse HEAD > TestResults/Resume/source-sha.txt
          tar -czf TestResults/Resume/source.tgz AGENTS.md Assets/_Anthropocene/Simulation Assets/_Anthropocene/Resources Tools Docs
          cp /tmp/mixed-checks.log TestResults/Resume/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-resume-source-and-tests
          path: TestResults/Resume/
          retention-days: 7
  worlds:
    needs: harden
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [control, candidate]
        seed: [11, 23, 47, 101, 1729]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.harden.outputs.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve matched world
        shell: bash
        run: |
          mkdir -p TestResults/MixedResume
          EXTRA=''
          if [ '${{ matrix.mode }}' = 'control' ]; then
            EXTRA='--set=NeolithicFishingEnabled=0,CorrectedAquaticSeasonalPressureEnabled=0,TradePracticePerValue=0,HusbandryProximityPracticePerYear=0,HusbandryTamingEnabled=0'
          fi
          dotnet run -c Release --project Tools/PerformanceAudit/Anthropocene.PerformanceAudit.csproj -- --players=80 --seed=${{ matrix.seed }} --shape=Continents --production-config=1 --turns=12 --post-opening-turns=40 --workers=4 --partition-size=64 --warmup=0 --details=1 --metrics=1 --fingerprints=0 $EXTRA --output=TestResults/MixedResume/${{ matrix.mode }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-resume-${{ matrix.mode }}-${{ matrix.seed }}
          path: TestResults/MixedResume/*.json
          retention-days: 7
