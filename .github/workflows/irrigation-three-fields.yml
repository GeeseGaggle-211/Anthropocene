name: Irrigation three-field cloud sweeps
on:
  push:
    branches: [experiments/irrigation-three-fields-20261108]
    paths:
      - 'Tools/IrrigationThreeFields/**'
      - '.github/workflows/irrigation-three-fields.yml'
permissions:
  contents: read
concurrency:
  group: irrigation-three-fields-20261108
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify production is unchanged
        run: git diff --exit-code 07f3501c2d5e047e44d61e85cc0d4613b54572d6 -- Assets/_Anthropocene/Simulation Assets/_Anthropocene/Resources
      - name: Provenance and build
        run: |
          mkdir -p TestResults/IrrigationThreeFields
          git rev-parse HEAD > TestResults/IrrigationThreeFields/experiment-commit.txt
          dotnet --info > TestResults/IrrigationThreeFields/runtime.txt
          dotnet build -c Release Tools/IrrigationThreeFields/Anthropocene.IrrigationThreeFields.csproj
      - name: Five seeded native-source sweeps
        run: |
          for seed in 11 23 47 101 1729; do
            dotnet run --no-build -c Release --project Tools/IrrigationThreeFields/Anthropocene.IrrigationThreeFields.csproj -- "$seed" "TestResults/IrrigationThreeFields/$seed"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irrigation-three-fields-20261108
          retention-days: 30
          path: |
            TestResults/IrrigationThreeFields/
            Tools/IrrigationThreeFields/Program.cs
            Tools/IrrigationThreeFields/Anthropocene.IrrigationThreeFields.csproj
            Assets/_Anthropocene/Simulation/*.cs
            Assets/_Anthropocene/Resources/OpeningConfig.json
            Assets/_Anthropocene/Resources/ResourceGenerationConfig.json
